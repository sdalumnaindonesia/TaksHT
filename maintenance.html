<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            text-align:center;
            overflow:hidden;
        }

        .container{
            max-width:600px;
            padding:40px;
        }

        .icon{
            font-size:90px;
            animation:rotate 3s linear infinite;
            margin-bottom:20px;
        }

        @keyframes rotate{
            from{transform:rotate(0deg);}
            to{transform:rotate(360deg);}
        }

        h1{
            font-size:42px;
            margin-bottom:15px;
        }

        p{
            color:#d1d5db;
            font-size:18px;
            line-height:1.7;
            margin-bottom:30px;
        }

        .countdown{
            display:inline-block;
            padding:15px 25px;
            background:rgba(255,255,255,.1);
            border-radius:10px;
            font-size:18px;
            backdrop-filter:blur(10px);
            margin-bottom:30px;
        }

        .btn{
            display:inline-block;
            text-decoration:none;
            background:#38bdf8;
            color:#fff;
            padding:14px 28px;
            border-radius:8px;
            transition:.3s;
            font-weight:bold;
        }

        .btn:hover{
            background:#0ea5e9;
            transform:translateY(-2px);
        }

        footer{
            margin-top:40px;
            color:#94a3b8;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">⚙️</div>

    <h1>Sedang di Takedown</h1>

    <p>
        Mohon maaf, website sedang di takedown
        Dikarenakan pembayaran belum diselesaikan
        Silakan kembali lagi nanti
    </p>

    <div class="countdown">
        🚧 Website akan segera kembali online.
    </div>

    <br>

    <footer>
        &copy; RAJAB SAPTA HADI
    </footer>
</div>

</body>
</html>
